<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>Mis Recordatorios</title>
</head>
<body>
<header>
  <div>
    <h1>Mis Recordatorios</h1>
    <p id="today"></p>
  </div>
  <button id="themeBtn" class="icon-btn" aria-label="Cambiar tema">🌙</button>
</header>

<main>
  <section class="toolbar">
    <button id="installBtn" class="secondary hidden">📲 Instalar app</button>
    <button id="notifyBtn" class="secondary">🔔 Activar notificaciones</button>
    <button id="addBtn" class="primary">＋ Nuevo recordatorio</button>
  </section>

  <section class="search">
    <input id="search" type="search" placeholder="Buscar recordatorios...">
  </section>

  <nav class="tabs">
    <button class="tab active" data-filter="pending">Pendientes</button>
    <button class="tab" data-filter="today">Hoy</button>
    <button class="tab" data-filter="all">Todos</button>
    <button class="tab" data-filter="done">Completados</button>
  </nav>

  <section id="stats" class="stats"></section>
  <section id="list" class="list"></section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modalTitle">Nuevo recordatorio</h2>
      <button id="closeModal" class="icon-btn">✕</button>
    </div>
    <form id="form">
      <input type="hidden" id="rid">
      <label>¿Qué necesitas recordar?
        <input id="title" required maxlength="100" placeholder="Ej. Pagar la luz">
      </label>
      <label>Descripción
        <textarea id="notes" maxlength="500" placeholder="Detalles opcionales"></textarea>
      </label>
      <div class="grid2">
        <label>Fecha
          <input id="date" type="date" required>
        </label>
        <label>Hora
          <input id="time" type="time" required>
        </label>
      </div>
      <label>Repetir
        <select id="repeat">
          <option value="none">No repetir</option>
          <option value="daily">Cada día</option>
          <option value="weekly">Cada semana</option>
          <option value="monthly">Cada mes</option>
        </select>
      </label>
      <div class="actions">
        <button type="button" id="cancelBtn" class="secondary">Cancelar</button>
        <button class="primary" type="submit">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
